<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>03_产品定义</title>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 750px; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #15171C;
  background: #FAF7F2;
}
.screen { position: relative; width: 750px; overflow: hidden; background: #FAF7F2; }
.screen.dark { background: #14161A; color: #F5F2EC; }
.screen.cream { background: #F2EBE1; }
.screen.dark::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(680px 420px at 88% 6%, rgba(255,106,0,.20), transparent 62%);
}
.pad { padding-left: 56px; padding-right: 56px; }
.rel { position: relative; z-index: 2; }

/* ---------- top nav ---------- */
.nav { display: flex; align-items: center; justify-content: space-between; }
.wordmark {
  font-family: "Avenir Next", "Helvetica Neue", sans-serif;
  font-size: 23px; font-weight: 600; letter-spacing: .3em;
}
.nav .meta {
  font-family: "Avenir Next", sans-serif;
  font-size: 16px; letter-spacing: .16em; color: #9A938A; text-transform: uppercase;
}
.dark .nav .meta { color: #7F858E; }

/* ---------- type ---------- */
.kicker {
  display: flex; align-items: center; gap: 13px;
  font-size: 19px; font-weight: 600; letter-spacing: .16em; color: #FF6A00;
  font-family: "PingFang SC", sans-serif;
}
.kicker::before { content: ""; width: 28px; height: 2px; background: #FF6A00; }
h2 {
  font-size: 47px; line-height: 1.32; font-weight: 600; letter-spacing: -.6px;
}
h2 .accent { color: #FF6A00; }
h2 .thin { font-weight: 300; }
.lead { font-size: 24px; line-height: 1.9; color: #565D66; font-weight: 400; }
.dark .lead { color: #A6ABB4; }
.small { font-size: 19px; line-height: 1.8; color: #8A8F97; }
.dark .small { color: #737982; }
.hr { height: 1px; background: #E6DED2; }
.dark .hr { background: #2A2D33; }
.num { font-family: "Avenir Next", sans-serif; font-variant-numeric: tabular-nums; }

/* ---------- components ---------- */
.card {
  background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 18px;
}
.dark .card { background: #1B1E23; border-color: #2C3037; }
.tag {
  display: inline-flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: 22px;
  font-size: 19px; color: #4A5058; background: #FFFFFF; border: 1px solid #E5DCCF;
}
.dark .tag { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.12); color: #CFD3D9; }

.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 54px; height: 54px; padding: 0 14px; border-radius: 10px;
  background: #FFFFFF; border: 1px solid #DCD3C6;
  box-shadow: 0 3px 0 #DCD3C6;
  font-size: 22px; font-weight: 500; color: #33383F; white-space: nowrap;
}
.kbd.sm { min-width: 46px; height: 46px; padding: 0 11px; font-size: 19px; border-radius: 9px; }
.dark .kbd { background: #23262C; border-color: #383C44; box-shadow: 0 3px 0 #383C44; color: #F1EEE8; }
.plus { font-size: 19px; color: #A8ADB4; margin: 0 2px; font-family: "Avenir Next", sans-serif; }
.keyrow { display: flex; align-items: center; gap: 6px; }

.dot { width: 7px; height: 7px; border-radius: 50%; background: #FF6A00; display: inline-block; }

/* photo frame */
.photo { border-radius: 20px; overflow: hidden; position: relative; background: #EDE4D8; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.caption { margin-top: 14px; font-size: 18px; color: #938B80; letter-spacing: .02em; }
.dark .caption { color: #767C85; }

/* table */
.rows { border-top: 1px solid #E6DED2; }
.dark .rows { border-top-color: #2A2D33; }
.row { display: flex; align-items: center; border-bottom: 1px solid #E6DED2; }
.dark .row { border-bottom-color: #2A2D33; }
</style>
<style></style>
</head><body><div class="screen " style="height:990px">
<div class="pad rel" style="padding-top:44px">
  <div class="nav">
    <div class="wordmark">MOVIO</div>
    <div class="meta">SEAMLESS KVM · 双机键鼠切换器</div>
  </div>
</div>
<div class="pad rel" style="margin-top:56px">
  <div class="kicker">02 — 产品定义</div>
  <h2 style="margin-top:22px;">把两台电脑，<br>用成一台。</h2><p class="lead" style="margin-top:24px">Movio 通过一套键鼠控制两台电脑。它不采集视频信号，也不需要在任何一台电脑上安装软件——插上，就能用。</p></div>
<div class="pad rel" style="margin-top:30px;display:flex;gap:10px">
  <span class="tag">无需驱动</span><span class="tag">无需软件</span><span class="tag">不采集画面</span><span class="tag">本地运行</span>
</div>
<div class="pad rel" style="margin-top:56px">
<div style="position:relative;height:296px">
  <div style="position:absolute;left:0;top:36px;width:278px;height:184px;border:2px solid #2F3A45;border-radius:14px;background:#fff;padding:9px">
    <div style="width:100%;height:100%;border-radius:7px;background:#F1EDE6;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;font-size:21px;color:#8A8F97;letter-spacing:.1em">B 主屏</div>
  </div>
  <div style="position:absolute;right:0;top:36px;width:278px;height:184px;border:2px solid #FF6A00;border-radius:14px;background:#fff;padding:9px">
    <div style="width:100%;height:100%;border-radius:7px;background:#FFF1E6;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;font-size:21px;color:#C56A2C;letter-spacing:.1em">A 主屏</div>
  </div>
  <div style="position:absolute;left:50%;top:36px;height:184px;border-left:2px dashed #FF6A00"></div>
  <div style="position:absolute;left:50%;top:0;transform:translateX(-50%);background:#FF6A00;color:#fff;font-size:15px;letter-spacing:.1em;padding:4px 13px;border-radius:11px;white-space:nowrap">共享边缘</div>
  <div style="position:absolute;left:66px;right:80px;top:128px;border-top:2px dashed rgba(255,106,0,.5)"></div>
  <div style="position:absolute;left:66px;top:120px;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:13px solid rgba(255,106,0,.8)"></div>
  <div style="position:absolute;left:430px;top:104px">
    <svg width="30" height="34" viewBox="0 0 24 24"><path d="M4 2 L20 12 L12.6 13.4 L16.6 21 L13.6 22.5 L9.6 15 L4 20 Z" fill="#15171C" stroke="#fff" stroke-width="1.6"/></svg>
  </div>
  <div style="position:absolute;left:0;top:240px;width:278px;text-align:center;font-size:18px;color:#8A8F97">电脑 B（左侧）</div>
  <div style="position:absolute;right:0;top:240px;width:278px;text-align:center;font-size:18px;color:#8A8F97">电脑 A（右侧 · 默认活动输出）</div>
</div>
</div>
<div class="pad rel" style="margin-top:6px">
  <p class="caption">默认布局为 A 在右、B 在左；光标推过共享边缘即完成切换，键盘输入同时跟随。屏幕位置只支持左右，不支持上下堆叠。</p>
</div>
</div></body></html>
