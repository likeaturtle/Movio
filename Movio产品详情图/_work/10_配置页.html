<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>10_配置页</title>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 750px; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #15171C;
  background: #FAF7F2;
}
.screen { position: relative; width: 750px; overflow: hidden; background: #FAF7F2; }
.screen.dark { background: #14161A; color: #F5F2EC; }
.screen.cream { background: #F2EBE1; }
.screen.dark::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(680px 420px at 88% 6%, rgba(255,106,0,.20), transparent 62%);
}
.pad { padding-left: 56px; padding-right: 56px; }
.rel { position: relative; z-index: 2; }

/* ---------- top nav ---------- */
.nav { display: flex; align-items: center; justify-content: space-between; }
.wordmark {
  font-family: "Avenir Next", "Helvetica Neue", sans-serif;
  font-size: 23px; font-weight: 600; letter-spacing: .3em;
}
.nav .meta {
  font-family: "Avenir Next", sans-serif;
  font-size: 16px; letter-spacing: .16em; color: #9A938A; text-transform: uppercase;
}
.dark .nav .meta { color: #7F858E; }

/* ---------- type ---------- */
.kicker {
  display: flex; align-items: center; gap: 13px;
  font-size: 19px; font-weight: 600; letter-spacing: .16em; color: #FF6A00;
  font-family: "PingFang SC", sans-serif;
}
.kicker::before { content: ""; width: 28px; height: 2px; background: #FF6A00; }
h2 {
  font-size: 47px; line-height: 1.32; font-weight: 600; letter-spacing: -.6px;
}
h2 .accent { color: #FF6A00; }
h2 .thin { font-weight: 300; }
.lead { font-size: 24px; line-height: 1.9; color: #565D66; font-weight: 400; }
.dark .lead { color: #A6ABB4; }
.small { font-size: 19px; line-height: 1.8; color: #8A8F97; }
.dark .small { color: #737982; }
.hr { height: 1px; background: #E6DED2; }
.dark .hr { background: #2A2D33; }
.num { font-family: "Avenir Next", sans-serif; font-variant-numeric: tabular-nums; }

/* ---------- components ---------- */
.card {
  background: #FFFFFF; border: 1px solid #E9E1D5; border-radius: 18px;
}
.dark .card { background: #1B1E23; border-color: #2C3037; }
.tag {
  display: inline-flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: 22px;
  font-size: 19px; color: #4A5058; background: #FFFFFF; border: 1px solid #E5DCCF;
}
.dark .tag { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.12); color: #CFD3D9; }

.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 54px; height: 54px; padding: 0 14px; border-radius: 10px;
  background: #FFFFFF; border: 1px solid #DCD3C6;
  box-shadow: 0 3px 0 #DCD3C6;
  font-size: 22px; font-weight: 500; color: #33383F; white-space: nowrap;
}
.kbd.sm { min-width: 46px; height: 46px; padding: 0 11px; font-size: 19px; border-radius: 9px; }
.dark .kbd { background: #23262C; border-color: #383C44; box-shadow: 0 3px 0 #383C44; color: #F1EEE8; }
.plus { font-size: 19px; color: #A8ADB4; margin: 0 2px; font-family: "Avenir Next", sans-serif; }
.keyrow { display: flex; align-items: center; gap: 6px; }

.dot { width: 7px; height: 7px; border-radius: 50%; background: #FF6A00; display: inline-block; }

/* photo frame */
.photo { border-radius: 20px; overflow: hidden; position: relative; background: #EDE4D8; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.caption { margin-top: 14px; font-size: 18px; color: #938B80; letter-spacing: .02em; }
.dark .caption { color: #767C85; }

/* table */
.rows { border-top: 1px solid #E6DED2; }
.dark .rows { border-top-color: #2A2D33; }
.row { display: flex; align-items: center; border-bottom: 1px solid #E6DED2; }
.dark .row { border-bottom-color: #2A2D33; }
</style>
<style></style>
</head><body><div class="screen " style="height:1250px">
<div class="pad rel" style="padding-top:44px">
  <div class="nav">
    <div class="wordmark">MOVIO</div>
    <div class="meta">SEAMLESS KVM · 双机键鼠切换器</div>
  </div>
</div>
<div class="pad rel" style="margin-top:56px">
  <div class="kicker">10 — 配置</div>
  <h2 style="margin-top:22px;">配置，在一个<br>不联网的网页里。</h2><p class="lead" style="margin-top:24px">配置页是随设备提供的一个本地 HTML 文件，通过 WebHID 直接读写设备，不加载外部脚本，也不上传任何数据。</p></div>
<div class="pad rel" style="margin-top:30px">
  <div style="border:1px solid #E4DBCE;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 14px 34px rgba(90,70,45,.10)">
    <div style="height:46px;background:#F4EFE7;border-bottom:1px solid #E7DFD3;display:flex;align-items:center;padding:0 16px;gap:8px">
      <span style="width:10px;height:10px;border-radius:50%;background:#E0D5C5"></span>
      <span style="width:10px;height:10px;border-radius:50%;background:#E0D5C5"></span>
      <span style="width:10px;height:10px;border-radius:50%;background:#E0D5C5"></span>
      <div style="flex:1;margin-left:14px;height:26px;border-radius:13px;background:#fff;border:1px solid #E7DFD3;display:flex;align-items:center;padding:0 12px;font-size:14px;color:#9A938A;letter-spacing:.04em">MOVIO 盘 / config.htm　·　Chrome WebHID</div>
    </div>
    <div style="height:470px;overflow:hidden;position:relative">
      <img src="../assets/config_page_small.jpg" style="width:100%;display:block;margin-top:-6px">
      <div style="position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)"></div>
    </div>
  </div>
</div>
<div class="pad rel" style="margin-top:26px">
  <div style="display:flex;gap:16px;padding:13px 0;border-top:1px solid #E6DED2"><span style="width:92px;font-size:19px;font-weight:600;color:#15171C;white-space:nowrap;flex:none">完全本地</span><span style="font-size:19px;line-height:1.6;color:#565D66">不联网、不加载外部脚本、不上传配置</span></div>
  <div style="display:flex;gap:16px;padding:13px 0;border-top:1px solid #E6DED2"><span style="width:92px;font-size:19px;font-weight:600;color:#15171C;white-space:nowrap;flex:none">即时下发</span><span style="font-size:19px;line-height:1.6;color:#565D66">改值立刻生效，点击“保存”才写入 Flash</span></div>
  <div style="display:flex;gap:16px;padding:13px 0;border-top:1px solid #E6DED2"><span style="width:92px;font-size:19px;font-weight:600;color:#15171C;white-space:nowrap;flex:none">自动退出</span><span style="font-size:19px;line-height:1.6;color:#565D66">约 5 分钟无操作自动重启回正常模式</span></div>
  <div style="display:flex;gap:16px;padding:13px 0;border-top:1px solid #E6DED2;border-bottom:1px solid #E6DED2"><span style="width:92px;font-size:19px;font-weight:600;color:#15171C;white-space:nowrap;flex:none">浏览器</span><span style="font-size:19px;line-height:1.6;color:#565D66">仅 Chrome / Chromium / Edge 支持 WebHID</span></div>
</div>
</div></body></html>
